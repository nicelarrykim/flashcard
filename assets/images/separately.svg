<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <!-- 배경 및 컴포넌트 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    
    <linearGradient id="cardLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="cardRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="receiptGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- 그림자 필터 -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 메인 배경 캔버스 -->
  <rect width="600" height="420" rx="28" fill="url(#bgGrad)"/>
  
  <!-- 배경 장식용 은은한 원형 패턴 -->
  <circle cx="150" cy="90" r="70" fill="#E2E8F0" opacity="0.4"/>
  <circle cx="450" cy="90" r="70" fill="#E2E8F0" opacity="0.4"/>
  <circle cx="300" cy="230" r="140" fill="#F8FAFC" opacity="0.6"/>

  <!-- ================= 중앙 분리선 & 가위 & 분리 화살표 (Separation Visual) ================= -->
  <!-- 중앙 수직 점선 (분할선) -->
  <line x1="300" y1="50" x2="300" y2="350" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>

  <!-- 상단 분리 화살표 (좌우로 갈라지는 모션) -->
  <g transform="translate(300, 52)">
    <!-- 중앙 분리 뱃지 -->
    <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#FFFFFF" filter="url(#subtleShadow)"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#6366F1" text-anchor="middle" letter-spacing="1.5">SEPARATE</text>
  </g>

  <!-- 좌우 분리 화살표 배지 -->
  <g transform="translate(190, 80)">
    <path d="M 30 0 L -10 0 M -2 7 L -10 0 L -2 -7" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="-25" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3B82F6" text-anchor="end">각자 (1)</text>
  </g>
  <g transform="translate(410, 80)">
    <path d="M -30 0 L 10 0 M 2 7 L 10 0 L 2 -7" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="25" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981" text-anchor="start">따로 (2)</text>
  </g>

  <!-- 가위 아이콘 (중앙 분할 상징) -->
  <g transform="translate(300, 205)">
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" filter="url(#subtleShadow)"/>
    <!-- 귀여운 가위 SVG -->
    <path d="M -7 -6 C -11 -6 -13 -3 -13 0 C -13 3 -11 5 -7 5 C -4 5 -3 3 -2 1 L 6 9" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="-8" cy="-1" r="3.5" stroke="#64748B" stroke-width="2" fill="none"/>
    <path d="M -7 6 C -11 6 -13 3 -13 0 C -13 -3 -11 -5 -7 -5 C -4 -5 -3 -3 -2 -1 L 6 -9" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="-8" cy="1" r="3.5" stroke="#64748B" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="2.5" fill="#EF4444"/>
  </g>

  <!-- ================= 좌측: 영수증 A + 결제 카드 A (개별 결제 1) ================= -->
  <g transform="translate(85, 110)" filter="url(#softShadow)">
    <!-- 영수증 본체 -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 168 0 C 174.63 0 180 5.37 180 12 L 180 200 L 165 192 L 150 200 L 135 192 L 120 200 L 105 192 L 90 200 L 75 192 L 60 200 L 45 192 L 30 200 L 15 192 L 0 200 Z" fill="url(#receiptGrad)"/>
    
    <!-- 영수증 헤더 -->
    <rect x="25" y="24" width="70" height="8" rx="4" fill="#94A3B8"/>
    <rect x="25" y="38" width="40" height="5" rx="2.5" fill="#CBD5E1"/>
    <line x1="25" y1="55" x2="155" y2="55" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- 품목 1 -->
    <rect x="25" y="70" width="60" height="7" rx="3.5" fill="#64748B"/>
    <rect x="125" y="70" width="30" height="7" rx="3.5" fill="#3B82F6"/>

    <!-- 품목 2 -->
    <rect x="25" y="88" width="75" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="132" y="88" width="23" height="7" rx="3.5" fill="#3B82F6"/>

    <line x1="25" y1="110" x2="155" y2="110" stroke="#E2E8F0" stroke-width="2"/>

    <!-- 합계 & 따로 계산 뱃지 -->
    <rect x="25" y="125" width="45" height="10" rx="5" fill="#1E293B"/>
    <rect x="110" y="123" width="45" height="14" rx="4" fill="#DBEAFE"/>
    <text x="132" y="134" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#1D4ED8" text-anchor="middle">$ 15.00</text>

    <!-- 바코드 -->
    <g transform="translate(35, 155)" fill="#94A3B8">
      <rect x="0" y="0" width="3" height="20"/>
      <rect x="6" y="0" width="5" height="20"/>
      <rect x="14" y="0" width="2" height="20"/>
      <rect x="19" y="0" width="6" height="20"/>
      <rect x="28" y="0" width="3" height="20"/>
      <rect x="34" y="0" width="4" height="20"/>
      <rect x="42" y="0" width="2" height="20"/>
      <rect x="47" y="0" width="7" height="20"/>
      <rect x="58" y="0" width="4" height="20"/>
      <rect x="65" y="0" width="3" height="20"/>
      <rect x="72" y="0" width="5" height="20"/>
      <rect x="80" y="0" width="2" height="20"/>
      <rect x="85" y="0" width="6" height="20"/>
      <rect x="94" y="0" width="4" height="20"/>
      <rect x="101" y="0" width="3" height="20"/>
    </g>

    <!-- 개별 신용카드 A (파란색) -->
    <g transform="translate(15, 160)" filter="url(#subtleShadow)">
      <rect x="0" y="0" width="150" height="92" rx="12" fill="url(#cardLeftGrad)"/>
      <!-- 카드 칩 -->
      <rect x="16" y="18" width="24" height="18" rx="4" fill="#FCD34D"/>
      <rect x="20" y="23" width="16" height="8" rx="2" fill="#F59E0B" opacity="0.6"/>
      <!-- 무선 결제 아이콘 -->
      <path d="M 46 22 A 6 6 0 0 1 46 32 M 50 19 A 11 11 0 0 1 50 35" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
      <!-- 카드 소유자 명 & 카드 번호 가상 바 -->
      <rect x="16" y="48" width="80" height="5" rx="2.5" fill="#FFFFFF" opacity="0.5"/>
      <rect x="16" y="65" width="50" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9"/>
      <!-- 카드 로고 심볼 -->
      <circle cx="118" cy="68" r="10" fill="#EF4444" opacity="0.85"/>
      <circle cx="130" cy="68" r="10" fill="#F59E0B" opacity="0.85"/>
    </g>
  </g>

  <!-- ================= 우측: 영수증 B + 결제 카드 B (개별 결제 2) ================= -->
  <g transform="translate(335, 110)" filter="url(#softShadow)">
    <!-- 영수증 본체 -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 168 0 C 174.63 0 180 5.37 180 12 L 180 200 L 165 192 L 150 200 L 135 192 L 120 200 L 105 192 L 90 200 L 75 192 L 60 200 L 45 192 L 30 200 L 15 192 L 0 200 Z" fill="url(#receiptGrad)"/>
    
    <!-- 영수증 헤더 -->
    <rect x="25" y="24" width="70" height="8" rx="4" fill="#94A3B8"/>
    <rect x="25" y="38" width="40" height="5" rx="2.5" fill="#CBD5E1"/>
    <line x1="25" y1="55" x2="155" y2="55" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- 품목 1 -->
    <rect x="25" y="70" width="80" height="7" rx="3.5" fill="#64748B"/>
    <rect x="125" y="70" width="30" height="7" rx="3.5" fill="#10B981"/>

    <!-- 품목 2 -->
    <rect x="25" y="88" width="55" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="130" y="88" width="25" height="7" rx="3.5" fill="#10B981"/>

    <line x1="25" y1="110" x2="155" y2="110" stroke="#E2E8F0" stroke-width="2"/>

    <!-- 합계 & 따로 계산 뱃지 -->
    <rect x="25" y="125" width="45" height="10" rx="5" fill="#1E293B"/>
    <rect x="110" y="123" width="45" height="14" rx="4" fill="#D1FAE5"/>
    <text x="132" y="134" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#047857" text-anchor="middle">$ 18.50</text>

    <!-- 바코드 -->
    <g transform="translate(35, 155)" fill="#94A3B8">
      <rect x="0" y="0" width="4" height="20"/>
      <rect x="7" y="0" width="3" height="20"/>
      <rect x="13" y="0" width="5" height="20"/>
      <rect x="21" y="0" width="2" height="20"/>
      <rect x="26" y="0" width="6" height="20"/>
      <rect x="35" y="0" width="3" height="20"/>
      <rect x="41" y="0" width="4" height="20"/>
      <rect x="48" y="0" width="6" height="20"/>
      <rect x="57" y="0" width="2" height="20"/>
      <rect x="62" y="0" width="5" height="20"/>
      <rect x="70" y="0" width="4" height="20"/>
      <rect x="77" y="0" width="3" height="20"/>
      <rect x="83" y="0" width="6" height="20"/>
      <rect x="92" y="0" width="2" height="20"/>
      <rect x="97" y="0" width="5" height="20"/>
      <rect x="104" y="0" width="2" height="20"/>
    </g>

    <!-- 개별 신용카드 B (에메랄드/그린색) -->
    <g transform="translate(15, 160)" filter="url(#subtleShadow)">
      <rect x="0" y="0" width="150" height="92" rx="12" fill="url(#cardRightGrad)"/>
      <!-- 카드 칩 -->
      <rect x="16" y="18" width="24" height="18" rx="4" fill="#FCD34D"/>
      <rect x="20" y="23" width="16" height="8" rx="2" fill="#F59E0B" opacity="0.6"/>
      <!-- 무선 결제 아이콘 -->
      <path d="M 46 22 A 6 6 0 0 1 46 32 M 50 19 A 11 11 0 0 1 50 35" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
      <!-- 카드 소유자 명 & 카드 번호 가상 바 -->
      <rect x="16" y="48" width="80" height="5" rx="2.5" fill="#FFFFFF" opacity="0.5"/>
      <rect x="16" y="65" width="50" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9"/>
      <!-- 카드 브랜드 로고 -->
      <path d="M 115 62 L 135 62 L 132 74 L 112 74 Z" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </g>

  <!-- ================= 하단 직관적 단어 의미 배너 ================= -->
  <g transform="translate(300, 385)">
    <rect x="-190" y="-17" width="380" height="34" rx="17" fill="#1E293B"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <tspan fill="#38BDF8" font-weight="800">separately</tspan> : 각자, 따로따로 (개별 계산)
    </text>
  </g>
</svg>

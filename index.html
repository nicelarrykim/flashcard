<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>VocaQuest - 영단어 플래시카드 & 맞추기 게임</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              750: '#243044'
            }
          }
        }
      }
    }
  </script>

  <!-- 커스텀 스타일 (3D 플립 & 모바일 가로스크롤 방지 등) -->
  <link rel="stylesheet" href="css/style.css?v=20261123_03">

  <!-- Tesseract.js OCR 라이브러리 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- sql.js SQLite DB 파일 파서 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

  <!-- Confetti 축하 애니메이션 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col transition-colors duration-200 bg-grid-pattern">

  <!-- 전역 비상 오류 알림 및 데이터 복구 배너 -->
  <div class="flex items-start gap-3">
      <div id="vq-error-box" class="hidden fixed top-4 inset-x-4 max-w-xl mx-auto z-50 p-4 rounded-2xl bg-rose-50 border-2 border-rose-400 text-rose-800 text-sm shadow-2xl">
      <span class="text-2xl">⚠️</span>
      <div class="flex-1">
        <h3 class="font-black text-rose-900 mb-1">앱 실행 중 오류가 발생했습니다</h3>
        <p id="vq-error-text" class="text-xs font-mono text-rose-700 break-all mb-3"></p>
        <div class="flex items-center gap-2">
          <button onclick="localStorage.clear(); location.reload();" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow transition">
            🔄 브라우저 데이터 초기화 및 복구
          </button>
          <button onclick="location.reload();" class="px-3 py-1.5 bg-white border border-rose-300 text-rose-700 hover:bg-rose-50 rounded-xl text-xs font-bold transition">
            새로고침
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    window.handleImageFallback = function(img) {
      if (!img) return;
      img.onerror = null;
      img.src = 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80';
    };

    window.addEventListener('error', function(e) {
      var box = document.getElementById('vq-error-box');
      var txt = document.getElementById('vq-error-text');
      if (box && txt) {
        box.classList.remove('hidden');
        txt.innerText = (e.message || 'Error') + (e.filename ? ' in ' + e.filename.split('/').pop() + ':' + e.lineno : '');
      }
    });
    window.addEventListener('unhandledrejection', function(e) {
      var box = document.getElementById('vq-error-box');
      var txt = document.getElementById('vq-error-text');
      if (box && txt) {
        box.classList.remove('hidden');
        txt.innerText = 'Promise Rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
      }
    });
  </script>

  <!-- 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80">
    <div class="max-w-6xl mx-auto px-2.5 sm:px-6 h-14 sm:h-16 flex items-center justify-between">
      
      <!-- 로고 및 서비스명 -->
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-white text-base sm:text-xl shadow-lg shadow-indigo-500/30 font-black shrink-0">
          VQ
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-tight text-slate-900 dark:text-white flex items-center gap-1">
            <span>VocaQuest</span>
            <span class="text-[9px] uppercase font-bold tracking-wider px-1.5 py-0.2 rounded-full bg-indigo-100 dark:bg-indigo-950/80 text-indigo-600 dark:text-indigo-400">
              Web App
            </span>
          </h1>
          <p class="text-[11px] text-slate-400 hidden sm:block">단어장별 영단어 암기 & 맞추기 게임</p>
        </div>
      </div>

      <!-- 중앙/우측 학습 요약 뱃지 (모바일 가로스크롤 방지 슬림 패딩) -->
      <div class="flex items-center gap-1.5 sm:gap-2.5">
        
        <!-- 현재 학습자 프로필 뱃지 (클릭 시 관리자 모드 프롬프트) -->
        <div id="header-profile-badge" class="flex items-center gap-1 bg-amber-50 dark:bg-amber-950/60 border border-amber-200 dark:border-amber-800/80 px-2 py-1 rounded-xl text-xs font-bold text-amber-800 dark:text-amber-300 cursor-pointer hover:bg-amber-100 dark:hover:bg-amber-900/60 transition shrink-0" title="클릭하여 학습자 프로필 관리 (암호: 2217)">
          <span id="active-profile-avatar">🛡️</span>
          <span id="active-profile-name" class="max-w-[60px] sm:max-w-[85px] truncate">기본 학습자</span>
          <span class="text-[10px] text-amber-600 dark:text-amber-400 font-extrabold">👑</span>
        </div>

        <!-- 서버 연동 상태 뱃지 (클릭 시 서버 설정 및 다중 기기 안내) -->
        <div id="header-server-badge" class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 px-2 py-1 rounded-xl text-[11px] font-bold text-slate-600 dark:text-slate-300 cursor-pointer transition shrink-0" title="서버 연동 상태 (클릭 시 서버 설정)">
          <span id="server-status-dot" class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span id="server-status-text" class="hidden xs:inline">서버 확인중</span>
        </div>

        <!-- 단어 통계 pill -->
        <div class="flex items-center gap-1 sm:gap-2 bg-slate-100 dark:bg-slate-800/80 px-2 sm:px-3 py-1 sm:py-1.5 rounded-xl sm:rounded-2xl text-[11px] sm:text-xs font-semibold border border-slate-200/50 dark:border-slate-700/50">
          <span class="text-slate-500 dark:text-slate-400">단어 <strong id="stat-total-words" class="text-indigo-600 dark:text-indigo-400">0</strong></span>
          <span class="text-slate-300 dark:text-slate-600 hidden xs:inline">|</span>
          <span class="text-emerald-600 dark:text-emerald-400">외움 <strong id="stat-memorized-words">0</strong></span>
          <span class="text-slate-300 dark:text-slate-600 hidden xs:inline">|</span>
          <span class="text-rose-500 dark:text-rose-400">오답 <strong id="stat-wrong-words">0</strong></span>
        </div>

        <!-- 효과음 토글 -->
        <button id="header-sound-btn" class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 flex items-center justify-center transition text-sm sm:text-base shrink-0" title="효과음 켜짐">
          🔊
        </button>

        <!-- 다크모드 토글 -->
        <button id="header-theme-btn" class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 flex items-center justify-center transition text-sm sm:text-base shrink-0" title="다크 모드 전환">
          🌙
        </button>
      </div>

    </div>
  </header>

  <!-- 전역 단어장(Deck) 및 학습 옵션 선택 바 (기본 슬림 뷰 + 확장/접기 지원) -->
  <div class="bg-indigo-50/80 dark:bg-indigo-950/50 border-b border-indigo-100 dark:border-indigo-900/60 px-2 sm:px-4 py-1.5 overflow-x-hidden">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-1.5 sm:gap-3">
      
      <!-- 좌측: 단어장 선택 (기본 노출) -->
      <div class="flex items-center gap-1.5 flex-1 min-w-0">
        <span class="text-xs font-black text-indigo-700 dark:text-indigo-300 shrink-0">
          📖
        </span>
        <select id="global-deck-select" class="flex-1 max-w-[210px] sm:max-w-xs px-2.5 py-1 rounded-xl bg-white dark:bg-slate-800 border border-indigo-200 dark:border-indigo-800 text-xs font-bold text-slate-900 dark:text-white shadow-sm focus:outline-none focus:border-indigo-500 cursor-pointer truncate">
        </select>
        <button id="global-create-deck-btn" class="px-2 py-1 rounded-xl bg-white dark:bg-slate-800 hover:bg-indigo-50 text-indigo-600 dark:text-indigo-400 text-xs font-bold border border-indigo-200 dark:border-indigo-800 shadow-sm transition shrink-0" title="새 단어장 만들기">
          + 새 단어장
        </button>
      </div>

      <!-- 우측: 옵션 확장/접기 토글 버튼 -->
      <div class="flex items-center gap-1 shrink-0">
        <button id="global-study-opt-toggle" class="px-2 sm:px-2.5 py-1 rounded-xl bg-white dark:bg-slate-800 hover:bg-indigo-50 dark:hover:bg-slate-750 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 shadow-sm text-xs font-bold flex items-center gap-1 transition">
          <span id="global-study-opt-summary" class="hidden xs:inline text-[10px] text-indigo-600 dark:text-indigo-400 font-semibold bg-indigo-50 dark:bg-indigo-950/80 px-1.5 py-0.2 rounded-md"></span>
          <span>⚙️ 옵션</span>
          <span id="global-opt-arrow" class="text-[10px] transition-transform duration-150">▾</span>
        </button>
      </div>

    </div>

    <!-- 확장 패널: 번호 범위 학습 & 사진 표시 옵션 (기본은 접힘: hidden) -->
    <div id="global-study-opt-panel" class="hidden max-w-5xl mx-auto mt-2 pt-2 border-t border-indigo-200/60 dark:border-indigo-900/60 animate-in fade-in duration-150">
      <div class="flex flex-wrap items-center justify-between gap-2 text-xs bg-white/90 dark:bg-slate-800/90 p-2 sm:p-2.5 rounded-2xl border border-indigo-100 dark:border-indigo-900/50 shadow-sm">
        
        <!-- 1. 단어 번호 범위 분할 공부 -->
        <div class="flex items-center gap-1.5 flex-wrap">
          <label class="flex items-center gap-1 cursor-pointer font-bold text-slate-700 dark:text-slate-300 select-none text-[11px] sm:text-xs">
            <input type="checkbox" id="global-range-toggle" class="rounded text-indigo-600 focus:ring-0 cursor-pointer">
            <span>번호 범위 공부</span>
          </label>
          <div id="global-range-inputs" class="flex items-center gap-1 opacity-50 pointer-events-none transition">
            <input type="number" id="global-range-start" min="1" placeholder="1" class="w-12 px-1.5 py-0.5 rounded-lg bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-center font-bold text-slate-900 dark:text-white text-xs">
            <span class="text-slate-400">~</span>
            <input type="number" id="global-range-end" min="1" placeholder="50" class="w-12 px-1.5 py-0.5 rounded-lg bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-center font-bold text-slate-900 dark:text-white text-xs">
            <span class="text-slate-500 dark:text-slate-400 text-[10px]">번</span>
            <button id="global-range-apply-btn" class="ml-0.5 px-2 py-0.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs transition shadow-sm">
              적용하고 닫기
            </button>
          </div>
        </div>

        <!-- 2. 단어 사진 옵션 & 단어장별 그림 위치 설정 -->
        <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap ml-auto">
          <!-- 단어장별 그림 위치 (기본: 뜻에 표시) -->
          <div class="flex items-center gap-1 bg-slate-50 dark:bg-slate-700/80 px-2 py-1 rounded-xl border border-slate-200 dark:border-slate-600">
            <span class="text-slate-600 dark:text-slate-300 font-bold shrink-0 flex items-center gap-1 text-[11px] sm:text-xs">
              <span>📍</span> <span>그림 위치:</span>
            </span>
            <select id="global-deck-image-pos-select" class="bg-transparent border-0 text-[11px] sm:text-xs font-bold text-slate-800 dark:text-slate-200 focus:outline-none cursor-pointer" title="현재 단어장의 그림 위치 설정">
              <option value="meaning">뜻에 표시 (기본)</option>
              <option value="word">영어단어에 표시</option>
            </select>
          </div>

          <!-- 사진 표시 모드 (자동 / 항상켜기 / 항상끄기) -->
          <div class="flex items-center gap-1 bg-slate-50 dark:bg-slate-700/80 px-2 py-1 rounded-xl border border-slate-200 dark:border-slate-600">
            <span class="text-slate-600 dark:text-slate-300 font-bold shrink-0 flex items-center gap-1 text-[11px] sm:text-xs">
              <span>🖼️</span> <span>사진:</span>
            </span>
            <select id="global-photo-mode-select" class="bg-transparent border-0 text-[11px] sm:text-xs font-bold text-slate-800 dark:text-slate-200 focus:outline-none cursor-pointer">
              <option value="auto">자동 (근위대 이상 숨김)</option>
              <option value="always_on">항상 켜기</option>
              <option value="always_off">항상 끄기</option>
            </select>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- 메인 게임/기능 탭 바 (가로 스크롤 시 좌측 버튼 짤림 방지 최적화) -->
  <nav class="bg-white/60 dark:bg-slate-900/60 backdrop-blur border-b border-slate-200/60 dark:border-slate-800/60 py-1.5 w-full">
    <div class="max-w-5xl mx-auto px-2 sm:px-4 overflow-x-auto no-scrollbar">
      <div class="flex items-center justify-start gap-1.5 w-max min-w-full py-1">
        <button data-tab="flashcard" class="nav-tab active shrink-0 px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 transition whitespace-nowrap">
          <span>🗂️</span> <span>플래시카드</span>
        </button>

        <button data-tab="quiz" class="nav-tab shrink-0 px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition whitespace-nowrap">
          <span>⚡</span> <span>스피드 퀴즈</span>
        </button>

        <button data-tab="match" class="nav-tab shrink-0 px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition whitespace-nowrap">
          <span>⚔️🛡️</span> <span>칼&방패 짝맞추기</span>
        </button>

        <button data-tab="scramble" class="nav-tab shrink-0 px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition whitespace-nowrap">
          <span>🔤</span> <span>스펠링 맞추기</span>
        </button>

        <button data-tab="speed-drop" class="nav-tab shrink-0 px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition whitespace-nowrap">
          <span>🛡️</span> <span>단어 낙하 방패</span>
        </button>

        <button data-tab="performance" class="nav-tab shrink-0 px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition whitespace-nowrap text-purple-600 dark:text-purple-400">
          <span>🏰</span> <span>나의 왕국</span>
        </button>

        <!-- 성채 수호 공성전 바로가기 버튼 -->
        <button id="nav-siege-btn" class="shrink-0 px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-black flex items-center gap-1.5 transition whitespace-nowrap bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 hover:from-amber-600 hover:to-rose-600 text-white shadow-md shadow-amber-500/25 border border-amber-300/40" title="성채 수호 공성전 (일일 2회 출정)">
          <span>⚔️</span> <span>성채 공성전</span>
        </button>

        <button data-tab="manager" class="nav-tab shrink-0 px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition whitespace-nowrap text-indigo-600 dark:text-indigo-400">
          <span>📚</span> <span>단어장 & OCR</span>
        </button>

        <!-- 관리자 모드 버튼 (암호: 2217) -->
        <button id="nav-admin-btn" class="shrink-0 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 transition whitespace-nowrap text-amber-700 dark:text-amber-300 bg-amber-100/70 hover:bg-amber-200 dark:bg-amber-950/60 dark:hover:bg-amber-900/60 border border-amber-300 dark:border-amber-800 shadow-sm" title="관리자 페이지 (암호: 2217)">
          <span>👑</span> <span>관리자</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- 메인 콘텐츠 영역 (모바일 가로스크롤 방지 슬림 패딩) -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-2 sm:p-6 md:p-8 overflow-x-hidden">
    
    <!-- 0. 개인 학습 성과 및 기사단 승급 탭 -->
    <section id="tab-performance" class="tab-content hidden w-full max-w-full overflow-hidden"></section>

    <!-- 1. 플래시카드 탭 -->
    <section id="tab-flashcard" class="tab-content w-full max-w-full overflow-hidden"></section>

    <!-- 2. 스피드 사지선다 퀴즈 탭 -->
    <section id="tab-quiz" class="tab-content hidden w-full max-w-full overflow-hidden"></section>

    <!-- 3. 카드 짝맞추기 탭 -->
    <section id="tab-match" class="tab-content hidden w-full max-w-full overflow-hidden"></section>

    <!-- 4. 스펠링 맞추기 (스크램블) 탭 -->
    <section id="tab-scramble" class="tab-content hidden w-full max-w-full overflow-hidden"></section>

    <!-- 5. 단어 낙하 디펜스 탭 -->
    <section id="tab-speed-drop" class="tab-content hidden w-full max-w-full overflow-hidden"></section>

    <!-- 6. 단어장 관리 및 OCR 탭 -->
    <section id="tab-manager" class="tab-content hidden w-full max-w-full overflow-hidden"></section>

  </main>

  <!-- 관리자 모달 컨테이너 -->
  <div id="admin-modal-container"></div>

  <!-- 푸터 (모바일에서는 화면 확보를 위해 숨김: hidden sm:block) -->
  <footer class="mt-auto py-5 sm:py-6 border-t border-slate-200/80 dark:border-slate-800/80 text-center text-xs text-slate-400 px-3 hidden sm:block">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 sm:gap-3">
      <p>💡 <strong>VocaQuest</strong> - 영어 단어 이미지 인식 플래시카드 & 맞추기 게임</p>
      <p class="flex items-center gap-2">
        <span>배포: GitHub Pages</span>
        <span>•</span>
        <span>오프라인 LocalStorage 지원</span>
      </p>
    </div>
  </footer>

  <!-- 앱 메인 스크립트 (ES Module - 캐시 방지 버전 파라미터 적용) -->
  <script type="module" src="js/app.js?v=20261123_03"></script>
</body>
</html>
